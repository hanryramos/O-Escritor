<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <title>Musical Escritor</title>
</head>

<body>

    <main class="login-page">

        <!-- =================================
             CONJUNTO GERAL
        ================================== -->

        <div class="login-card">

            <!-- =================================
                 FUNDO GERAL
            ================================== -->

            <div class="login-background">

                <!-- PAINEL ESQUERDO -->
                <div class="translucid">

                    <img src="assets/BOXtranslucid.svg" alt="" data-anim="fadeIn" data-delay="0.15s">

                </div>


                <!-- IMAGEM DIREITA -->
                <div class="login-img">

                    <img src="assets/img-login.png" alt="Equipe do musical" data-anim="fadeIn" data-delay="0.4s">

                </div>

            </div>


            <!-- =================================
                 CONTEÚDO DO LOGIN
            ================================== -->

            <div class="login-content">

<img class="logo-lg" src="assets/tipografia.png" alt="Musical Escritor" data-anim="zoomIn" data-delay="0.05s">


                <div class="welcome">

                    <h2 data-anim="fadeUp" data-delay="0.15s">
                        bem - vindo(a)!
                    </h2>

                    <h1 data-anim="fadeUp" data-delay="0.25s">
                        Faça seu <span>LOGIN</span>
                    </h1>

                    <p data-anim="fadeUp" data-delay="0.35s">
                        Acesse a área da equipe e continue<br>
                        fazendo parte dessa história.
                    </p>

                </div>


                <form class="container-login" action="pg1.html" id="login-form">

                    <div class="input-box" data-anim="fadeUp" data-delay="0.5s">

                        <input type="email" id="loginEmail" placeholder="Seu e-mail">

                        <i class="bx bx-user"></i>

                    </div>


                    <div class="input-box" data-anim="fadeUp" data-delay="0.6s">

                        <input type="password" id="loginPassword" placeholder="Senha">

                        <i class="bx bx-show"></i>

                    </div>


                    <label class="remember" data-anim="fadeUp" data-delay="0.72s">

                        <input type="checkbox">

                        <span>
                            Lembre-se de mim
                        </span>

                    </label>


                    <button type="submit" data-anim="zoomIn" data-delay="0.85s">
                        LOGIN
                    </button>

                    <div class="google-divider" data-anim="fadeIn" data-delay="0.95s">
                        <span>ou</span>
                    </div>

                    <button type="button" class="btn-google" id="loginGoogle" data-anim="zoomIn" data-delay="1s">
                        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                            <path fill="#4285F4" d="M23.49 12.27c0-.79-.07-1.54-.19-2.27H12v4.51h6.47c-.29 1.48-1.14 2.73-2.4 3.58v3h3.86c2.26-2.09 3.56-5.17 3.56-8.82z"/>
                            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.86-3c-1.08.72-2.45 1.16-4.07 1.16-3.13 0-5.78-2.11-6.73-4.96H1.29v3.09C3.26 21.3 7.31 24 12 24z"/>
                            <path fill="#FBBC05" d="M5.27 14.29c-.25-.72-.38-1.49-.38-2.29s.14-1.57.38-2.29V6.62H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.38l3.98-3.09z"/>
                            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.98 3.09C6.22 6.86 8.87 4.75 12 4.75z"/>
                        </svg>
                        Entrar com Google
                    </button>

                    <p class="login-error" id="loginError" role="alert"></p>

                </form>


                <img class="logo-MJ" src="assets/logo start.png" alt="START" data-anim="fadeUp" data-delay="1.05s">

            </div>

        </div>


        <!-- =================================
             DECORAÇÕES
        ================================== -->

        <img class="decoration decoration-top" src="assets/Ellipse 3.svg" alt="" data-anim="fadeIn" data-float="slow" data-delay="0.1s">

        <img class="decoration decoration-bottom" src="assets/Ellipse 2.png" alt="" data-anim="fadeIn" data-float="slow" data-delay="0.55s">

    </main>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

    <script src="auth.js"></script>

    <script src="animations.js"></script>

</body>
</html>
