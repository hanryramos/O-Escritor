<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dark-mode.css">

    <link rel="manifest" href="manifest.json">

    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <title>Musical Escritor</title>
</head>

<body>

    <main class="login-page">

        <!-- =================================
             CONJUNTO GERAL
        ================================== -->

        <div class="login-card">

            <!-- =================================
                 FUNDO GERAL
            ================================== -->

            <div class="login-background">

                <!-- PAINEL ESQUERDO -->
                <div class="translucid">

                    <img src="assets/BOXtranslucid.svg" alt="" data-anim="fadeIn" data-delay="0.15s">

                </div>


                <!-- IMAGEM DIREITA -->
                <div class="login-img">

                    <img src="assets/img-login.png" alt="Equipe do musical" data-anim="fadeIn" data-delay="0.4s">

                </div>

            </div>


            <!-- =================================
                 CONTEÚDO DO LOGIN
            ================================== -->

            <div class="login-content">

                <div class="login-content-inner">

                    <div class="login-topo">

                    <img class="logo-lg" src="assets/tipografia.png" alt="Musical Escritor" data-anim="zoomIn" data-delay="0.05s">

                    <div class="welcome">

                        <h2 data-anim="fadeUp" data-delay="0.15s">
                            bem - vindo(a)!
                        </h2>

                        <h1 data-anim="fadeUp" data-delay="0.25s">
                            Faça seu <span>LOGIN</span>
                        </h1>

                        <p data-anim="fadeUp" data-delay="0.35s">
                            Acesse a área da equipe e continue<br>
                            fazendo parte dessa história.
                        </p>

                    </div>

                </div>


                <form class="container-login" action="pg1.html" id="login-form">

                    <div class="input-box" data-anim="fadeUp" data-delay="0.5s">

                        <input type="email" id="loginEmail" placeholder="Seu e-mail">

                        <i class="bx bx-user"></i>

                    </div>


                    <div class="input-box" data-anim="fadeUp" data-delay="0.6s">

                        <input type="password" id="loginPassword" placeholder="Senha">

                        <i class="bx bx-show"></i>

                    </div>


                    <label class="remember" data-anim="fadeUp" data-delay="0.72s">

                        <input type="checkbox">

                        <span>
                            Lembre-se de mim
                        </span>

                    </label>


                    <button type="submit" data-anim="zoomIn" data-delay="0.85s">
                        LOGIN
                    </button>

                    <p class="login-error" id="loginError" role="alert"></p>

                </form>


                <a class="logo-start" href="index.html" title="Voltar ao início" data-anim="fadeUp" data-delay="1.05s">

                    <img class="logo-MJ" src="assets/logo start.png" alt="START">

                </a>

                </div>

            </div>

        </div>


        <!-- =================================
             DECORAÇÕES
        ================================== -->

        <img class="decoration decoration-top" src="assets/Ellipse 3.svg" alt="" data-anim="fadeIn" data-float="slow" data-delay="0.1s">

        <img class="decoration decoration-bottom" src="assets/Ellipse 2.png" alt="" data-anim="fadeIn" data-float="slow" data-delay="0.55s">

    </main>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging-compat.js"></script>

    <script src="auth.js"></script>
    <script src="theme.js"></script>
    <script src="animations.js"></script>

</body>
</html>
